<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1e1c">
<title>Échecs : analyse et entraînement</title>
<link rel="icon" href="pieces/wN.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a href="#/" class="logo"><img src="pieces/wN.svg" alt=""><span class="logo-txt">Échecs</span></a>
  <nav id="tabs">
    <a href="#/" data-tab="analyse">Analyse</a>
    <a href="#/openings" data-tab="openings">Ouvertures</a>
    <a href="#/middlegame" data-tab="middlegame">Milieu de jeu</a>
    <a href="#/endgames" data-tab="endgames">Finales</a>
    <a href="#/settings" data-tab="settings" title="Réglages et synchronisation">⚙</a>
  </nav>
  <span id="status-bar"><span id="engine" class="muted">Recherche du moteur…</span><span id="sync-status" class="muted"></span></span>
</header>

<main id="home-view" class="view">
  <section class="card">
    <h1>Mes parties chess.com</h1>
    <div class="row">
      <input id="user" placeholder="Votre pseudo chess.com" autocomplete="off" spellcheck="false" autocapitalize="off">
      <button id="load" class="btn primary">Récupérer mes parties</button>
    </div>
    <p id="load-progress" class="muted">Seules les parties terminées sont récupérées (jamais une partie en cours).</p>
  </section>
  <section class="card">
    <div class="row filters">
      <input id="filter" placeholder="Filtrer par adversaire">
      <select id="tc">
        <option value="">Toutes cadences</option>
        <option value="bullet">Bullet</option>
        <option value="blitz">Blitz</option>
        <option value="rapid">Rapide</option>
        <option value="daily">Par jour</option>
      </select>
      <label><input type="checkbox" id="only-analyzed"> Déjà analysées</label>
      <span id="count" class="muted"></span>
    </div>
    <div class="table-wrap">
    <table id="games">
      <thead><tr><th>Date</th><th class="opt">Cadence</th><th>Moi</th><th>Adversaire</th><th>Résultat</th><th>Précision</th></tr></thead>
      <tbody></tbody>
    </table>
    </div>
    <button id="more" class="btn hidden">Afficher plus</button>
  </section>
</main>

<main id="game-view" class="view hidden">
  <div class="left">
    <div class="player" id="player-top"></div>
    <div class="board-wrap">
      <div id="evalbar"><div class="white"></div><span class="label"></span></div>
      <div id="board"></div>
    </div>
    <div class="player" id="player-bottom"></div>
    <div class="controls">
      <button id="back" class="btn" title="Retour à la liste">☰<span class="opt"> Parties</span></button>
      <button id="first" class="btn" title="Début (↑)">⏮</button>
      <button id="prev" class="btn" title="Coup précédent (←)">◀</button>
      <button id="next" class="btn" title="Coup suivant (→)">▶</button>
      <button id="last" class="btn" title="Fin (↓)">⏭</button>
      <button id="flip" class="btn" title="Retourner l'échiquier (F)">⇅</button>
      <label class="muted small"><input type="checkbox" id="show-next"> Flèche du meilleur coup suivant</label>
    </div>
    <div id="graph" title="Cliquez pour aller à ce moment de la partie"></div>
  </div>
  <div class="right">
    <div class="card head">
      <div id="opening"></div>
      <div id="game-meta" class="muted small"></div>
      <div id="progress" class="hidden"><div class="bar"><div class="fill"></div></div><span class="txt"></span> <button id="resume" class="btn small hidden">Reprendre</button></div>
    </div>
    <div class="card" id="coach"></div>
    <div class="card"><div id="moves"></div></div>
    <div class="card" id="summary"></div>
    <div class="card foot"><button id="reanalyze" class="btn small">Relancer l'analyse</button></div>
  </div>
</main>

<main id="openings-view" class="view hidden page"></main>
<main id="middlegame-view" class="view hidden page"></main>
<main id="endgames-view" class="view hidden page"></main>
<main id="settings-view" class="view hidden page"></main>

<div id="toast"></div>
<div id="copy-fallback" class="hidden"><div class="card"><p>Copiez ce texte (Ctrl+A puis Ctrl+C) et collez-le sur claude.ai :</p><textarea readonly></textarea><button class="btn">Fermer</button></div></div>
<script type="module" src="main.js"></script>
</body>
</html>
